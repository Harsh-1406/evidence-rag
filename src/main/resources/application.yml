spring:
  application:
    name: evidence-rag
  config:
    import: optional:file:.env[.properties]   # local secrets; in CI use real env vars
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5      # free Postgres has few connections
      minimum-idle: 0           # Neon suspends when idle; don't keep stale connections
      idle-timeout: 60000
      connection-timeout: 30000 # allow for Neon cold start
  jpa:
    open-in-view: false         # no DB connection held while rendering/HTTP calls
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc.batch_size: 50     # batch chunk inserts
        order_inserts: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always      # dev only; tighten before any public deploy
